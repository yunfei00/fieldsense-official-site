services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: fieldsense-backend
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      SQLITE_PATH: "/data/db.sqlite3"
    volumes:
      - fieldsense_sqlite:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    container_name: fieldsense-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: fieldsense-nginx
    profiles:
      - nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres:16-alpine
    container_name: fieldsense-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_DB: fieldsense
      POSTGRES_USER: fieldsense
      POSTGRES_PASSWORD: fieldsense_dev_password
    volumes:
      - fieldsense_postgres:/var/lib/postgresql/data

volumes:
  fieldsense_sqlite:
  fieldsense_postgres:

