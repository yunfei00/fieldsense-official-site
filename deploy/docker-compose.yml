services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: fieldsense-backend
    env_file:
      - ./.env
    volumes:
      - ./data/backend:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    container_name: fieldsense-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: fieldsense-nginx
    profiles:
      - nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres:16-alpine
    container_name: fieldsense-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_DB: fieldsense
      POSTGRES_USER: fieldsense
      POSTGRES_PASSWORD: fieldsense_dev_password
    volumes:
      - fieldsense_postgres:/var/lib/postgresql/data

volumes:
  fieldsense_postgres:

